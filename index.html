<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8FB">
<title>Swedish Verb Trainer</title>
<meta name="description" content="Learn 499 Swedish verbs with English and Persian meanings, examples and audio.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verb Trainer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8FB; --card:#FFFFFF; --ink:#15233B; --soft:#5A6A82; --line:#E2E8F1;
  --blue:#1F5FAF; --blue-soft:#E9F1FC; --yellow:#F5C400;
  --green:#1A8F51; --green-soft:#E4F6EC; --red:#D33636; --red-soft:#FCE8E8;
  --amber:#8A5D0B; --amber-soft:#FFF5DB;
  --btn-blue:#1F5FAF; --btn-green:#1A8F51; --btn-red:#D33636; --on-btn:#FFFFFF;
  --shadow:0 6px 18px rgba(31,58,95,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1726; --card:#172235; --ink:#E8EEF7; --soft:#9DACC2; --line:#28364D;
    --blue:#7FB2FF; --blue-soft:#1C2E4A; --yellow:#F5C400;
    --green:#4FD68D; --green-soft:#143022; --red:#FF7A7A; --red-soft:#3A1D21;
    --amber:#F2C14E; --amber-soft:#33290F;
    --btn-blue:#2F6FC4; --btn-green:#1B8A4F; --btn-red:#C53434;
    --shadow:0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1726; --card:#172235; --ink:#E8EEF7; --soft:#9DACC2; --line:#28364D;
  --blue:#7FB2FF; --blue-soft:#1C2E4A; --yellow:#F5C400;
  --green:#4FD68D; --green-soft:#143022; --red:#FF7A7A; --red-soft:#3A1D21;
  --amber:#F2C14E; --amber-soft:#33290F;
  --btn-blue:#2F6FC4; --btn-green:#1B8A4F; --btn-red:#C53434;
  --shadow:0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.fa,[dir="rtl"]{font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:2rem;line-height:1.15;margin:2px 0 0;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.15rem;margin:28px 0 10px;font-weight:800}
.soft{color:var(--soft)}
.small{font-size:.875rem}
.hello{color:var(--blue);font-weight:700}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border-radius:16px;border:1.5px solid transparent;font-size:1.1rem;font-weight:700;padding:0 18px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn-blue{background:var(--btn-blue);color:var(--on-btn)}
.btn-green{background:var(--btn-green);color:var(--on-btn)}
.btn-red{background:var(--btn-red);color:var(--on-btn)}
.btn-ghost{background:var(--card);color:var(--blue);border-color:var(--line)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bar{width:100%;height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:10px;background:var(--blue);transition:width .4s}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.big{font-size:2.6rem;font-weight:800;color:var(--blue);line-height:1}
.row{display:flex;align-items:center;gap:10px}
.mini{display:flex;margin-top:16px}
.mini>div{flex:1}
.mini b{font-size:1.4rem;font-weight:800;display:flex;align-items:center;gap:6px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:0;border-radius:20px;padding:16px;margin-bottom:10px;min-height:76px;box-shadow:var(--shadow)}
.mode:disabled{opacity:.5;cursor:default}
.mode .em{font-size:1.8rem}
.mode b{display:block;font-size:1.05rem}
.mode span{display:block;color:var(--soft);font-size:.9rem;margin-top:2px}
.chev{margin-left:auto;font-size:1.8rem;color:var(--soft)}
.chips{display:flex;gap:10px}
.chip{flex:1;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;color:var(--soft)}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.pill{flex:none;height:38px;padding:0 14px;border-radius:99px}
.note{margin-top:22px;padding:14px;border-radius:14px;background:var(--blue-soft);font-size:.85rem;line-height:1.5}
/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;padding:8px 2px 6px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--soft)}
.tab .ic{font-size:1.25rem;opacity:.5}
.tab.on{color:var(--blue)}
.tab.on .ic{opacity:1}
/* Flashcard */
.studytop{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.x{border:0;background:none;font-size:1.4rem;color:var(--soft);width:44px;height:44px;border-radius:12px}
.verb{display:flex;align-items:center;gap:12px}
.verb h3{flex:1;margin:0;font-size:clamp(2rem,9vw,2.7rem);line-height:1.08;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.verb h3::after{content:"";display:block;width:46px;height:5px;border-radius:3px;background:var(--yellow);margin-top:10px}
.spk{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--blue-soft);font-size:1.05rem;display:grid;place-items:center}
.spk.lg{width:54px;height:54px;font-size:1.4rem}
.spk.playing{outline:2px solid var(--blue)}
table.forms{width:100%;margin-top:18px;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.forms td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle;height:54px}
.forms tr:first-child td{border-top:0}
.forms .lab{width:96px;color:var(--soft);font-size:.85rem;font-weight:600}
.forms .val{font-size:1.2rem;font-weight:600;overflow-wrap:anywhere}
.forms .val.none{color:var(--soft);font-weight:400}
.forms .sp{width:56px;text-align:right}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--red-soft);color:var(--red);font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;margin-bottom:12px}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.word{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex:1 1 100%;min-width:0;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.word small{font-size:.72rem;font-weight:700;letter-spacing:.01em}
.word span{font-size:1.1rem;font-weight:700;text-align:right;overflow-wrap:anywhere;line-height:1.25}
.word small{flex:none}
.word.el small{color:var(--green)}
.word.in small{color:var(--blue)}
.word.ad small{color:var(--red)}
.toggle{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:0;border-radius:20px;padding:16px;box-shadow:var(--shadow);min-height:72px}
.sw{flex:none;margin-left:auto;width:52px;height:30px;border-radius:30px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--btn-blue)}
.sw.on::after{transform:translateX(22px)}
.hint{text-align:center;color:var(--soft);margin:22px 0 4px}
.verdict{margin-top:18px;padding:10px 12px;border-radius:12px;font-weight:700}
.lbl{font-size:.8rem;color:var(--soft);font-weight:600;margin:18px 0 4px}
.en{font-size:1.35rem;font-weight:700}
.fa{direction:rtl;text-align:right;unicode-bidi:plaintext;line-height:1.9}
.famean{font-size:1.5rem;font-weight:700}
.ex{margin-top:20px;padding:14px;border-radius:16px;background:var(--blue-soft)}
.ex .sv{font-size:1.15rem;font-weight:700;flex:1}
.ex .exen{color:var(--soft);margin-top:8px}
.ex .fa{color:var(--soft);margin-top:4px;font-size:1.05rem}
.flag{margin-top:14px;background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px;font-size:.85rem}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.actions .in{max-width:560px;margin:0 auto;display:flex;gap:12px}
.enter{animation:enter .26s ease-out}
.reveal{animation:reveal .3s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter,.reveal{animation:none}.bar>i{transition:none}}
/* Lists */
.search{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit;margin-top:14px}
.list{margin:14px -18px 0;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 18px;min-height:64px}
.item:active{background:var(--blue-soft)}
.item .name{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.item .m{color:var(--soft);font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .f{margin-left:auto;max-width:42%;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
.back{border:0;background:none;color:var(--blue);font-weight:700;font-size:1.1rem;padding:6px 0 12px}
.hist{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.hist i{width:12px;height:12px;border-radius:3px}
/* Progress */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.tile b{display:block;font-size:1.6rem;font-weight:800}
.chart{display:flex;gap:8px;align-items:flex-end;height:150px;margin-top:16px}
.col{flex:1;display:flex;flex-direction:column;align-items:center}
.track{width:70%;height:100px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--bg);border-radius:4px;overflow:hidden}
.col small{font-size:.7rem;color:var(--soft);margin-top:3px;min-height:1em}
.sess{padding:8px 0;border-top:1px solid var(--line)}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;padding:8px 0}
.rep p{margin:4px 0;font-size:.82rem;color:var(--soft)}
.done{text-align:center;padding:60px 10px}
.done .e{font-size:4rem}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--soft);margin-top:8px}

#newver{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--btn-blue);color:#fff;padding:12px 16px}
.banner .small{opacity:.9;font-size:.82rem}
.bbtn{flex:none;border:0;border-radius:12px;background:#fff;color:#1F5FAF;font-weight:800;padding:10px 14px;min-height:44px}
.whatsnew{background:var(--blue-soft);border-radius:18px;padding:16px;margin-bottom:18px}
.whatsnew ul{margin:8px 0 4px;padding-left:20px}
.whatsnew li{margin:4px 0;font-size:.92rem}
.gate{text-align:center;padding:56px 8px}
.gate .e{font-size:3.6rem}
.gate p{max-width:420px;margin:12px auto 0}
.member{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);margin-top:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--line);flex:none;object-fit:cover}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member{flex-wrap:wrap}
.mact{display:flex;gap:8px;flex:1 1 100%;padding-left:52px}
.mact .sbtn{flex:1}
.sbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700}
.sbtn.green{background:var(--btn-green);border-color:var(--btn-green);color:#fff}
.sbtn:disabled{opacity:.5}
.steps{padding-left:20px;margin:8px 0 0}
.steps li{margin:6px 0}
.authform{display:flex;flex-direction:column;gap:10px;text-align:left;max-width:380px;margin:20px auto 0}
.authform .search{margin-top:0}
.codein{font-size:1.6rem;letter-spacing:.3em;text-align:center;font-weight:700}
.codein::placeholder{color:var(--line)}
.vidbtn{margin-top:18px}
.vidmodal{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.55);display:flex;align-items:flex-end;justify-content:center}
.vidmodal[hidden]{display:none}
.vidsheet{background:var(--card);width:100%;max-width:640px;max-height:100%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.vidmodal{align-items:center}.vidsheet{border-radius:22px}}
.vidtop{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.vidforms{flex-wrap:wrap;margin-top:12px}
.vidctl{margin:12px 0}
.vidctl .btn{min-height:46px;font-size:.95rem;padding:0 10px}
.ygbox{min-height:220px;border-radius:14px;overflow:hidden;background:#fff}
.vidcredit{font-size:.72rem;color:var(--soft);margin:10px 2px 0;line-height:1.45}
.vidcredit a{color:var(--blue)}
.seg{display:flex;gap:4px;background:var(--line);border-radius:14px;padding:4px;max-width:380px;margin:20px auto 0}
.seg button{flex:1;border:0;border-radius:11px;background:transparent;min-height:44px;font-weight:700;color:var(--soft)}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.autherr{color:var(--red);background:var(--red-soft);border-radius:12px;padding:10px 12px;max-width:380px;margin:16px auto 0;text-align:left}
.authinfo{color:var(--ink);background:var(--blue-soft);border-radius:12px;padding:10px 12px;max-width:380px;margin:16px auto 0;text-align:left}
.av{display:grid;place-items:center;font-weight:800;color:var(--blue);background:var(--blue-soft)}
.gate .chips{max-width:380px;margin-left:auto;margin-right:auto}
</style>
</head>

<script>

/* ---------- Data ---------- */
const searchKey = s => (s||"").toLowerCase().trim().replace(/[åä]/g,"a").replace(/ö/g,"o").replace(/é/g,"e");
const VERBS = [];
const SEEN = new Map();
const IMPORT_SKIPPED = SKIPPED.slice();
for (const r of RAW) {
  const [nr,inf,pres,pret,sup,imp,group,en,fa,sv,svEn,svFa,flag] = r;
  const v = {id:"pdf1:"+nr,nr,inf,full:"att "+inf,pres,pret,sup,perf:sup?"har "+sup:"",imp,group,en,fa,
    ex: sv ? [{sv,en:svEn,fa:svFa}] : [], flag: flag||null, words: HINTS[nr] || null};
  const key = [inf,pres,pret,sup].map(x=>(x||"").toLowerCase()).join("|");
  if (SEEN.has(key)) { IMPORT_SKIPPED.push({nr,reason:"Duplicate of "+v.full+" (row "+SEEN.get(key).nr+")"}); continue; }
  SEEN.set(key,v);
  v.search = searchKey([inf,pres,pret,sup,en,fa].join(" "));
  VERBS.push(v);
}
const BY_ID = Object.fromEntries(VERBS.map(v=>[v.id,v]));
const INDEX = Object.fromEntries(VERBS.map((v,i)=>[v.id,i]));
const FLAGGED = VERBS.filter(v=>v.flag);

/* ---------- Progress ---------- */
function emptyProgress(){ return {verbs:{},daily:{},sessions:[],learnPos:0,laps:0,settings:{size:20,hints:true},updatedAt:0}; }
function loadLocal(){
  try { const raw = localStorage.getItem(lsKey()); if (raw) return Object.assign(emptyProgress(), JSON.parse(raw)); } catch(e) {}
  return emptyProgress();
}
function saveLocal(){ if (!UID) return; try { localStorage.setItem(lsKey(), JSON.stringify(P)); } catch(e) {} }
function lsKey(){ return UID ? LS_KEY+":"+UID : LS_KEY; }
let P = emptyProgress();

const dayKey = (ts=Date.now()) => { const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

function applyAnswer(id, ok, learnIdx){
  const now = Date.now();
  const prev = P.verbs[id] || {c:0,w:0,red:false,streak:0,h:[]};
  const v = Object.assign({}, prev, {h: prev.h.concat([[now, ok?1:0]]), last: now});
  if (ok) { v.c++; v.streak++; if (v.red && v.streak >= MASTER_STREAK) { v.red=false; v.mastered=now; } }
  else { v.w++; v.streak=0; v.red=true; v.mastered=null; }
  P.verbs[id] = v;
  const k = dayKey(now);
  const d = P.daily[k] || {n:0,c:0,w:0};
  d.n++; ok ? d.c++ : d.w++;
  P.daily[k] = d;
  if (learnIdx != null && learnIdx >= P.learnPos) {
    P.learnPos = learnIdx + 1;
    if (P.learnPos >= VERBS.length) { P.learnPos = 0; P.laps++; }
  }
  logHistory(now, id, ok);
  persist();
  return v;
}
function addSession(sum){ if (!sum.n) return; P.sessions.unshift(Object.assign({ts:Date.now()},sum)); P.sessions = P.sessions.slice(0,200); persist(); }

const shuffle = a => { a=a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function buildSession(mode){
  const size = P.settings.size || 20;
  const red = VERBS.filter(v=>P.verbs[v.id]?.red).map(v=>v.id);
  if (mode==="mistakes") return {mode, queue: shuffle(red).map(id=>({id}))};
  if (mode==="random") {
    const rp = shuffle(red).slice(0, Math.ceil(size/4)); const used = new Set(rp);
    const rest = shuffle(VERBS.map(v=>v.id).filter(id=>!used.has(id))).slice(0, size-rp.length);
    return {mode, queue: shuffle(rp.concat(rest)).map(id=>({id}))};
  }
  const start = Math.min(P.learnPos||0, VERBS.length-1); const seq = [];
  for (let i=0;i<Math.min(size,VERBS.length);i++){ const idx=(start+i)%VERBS.length; seq.push({id:VERBS[idx].id, learnIdx:idx}); }
  const inSeq = new Set(seq.map(q=>q.id));
  const review = shuffle(red.filter(id=>!inSeq.has(id))).slice(0, Math.ceil(size/4)).map(id=>({id}));
  return {mode, queue: review.concat(seq)};
}

function stats(){
  let studied=0,known=0,ever=0,red=0,ca=0,wa=0;
  for (const v of VERBS){ const s=P.verbs[v.id]; if(!s) continue; studied++; ca+=s.c; wa+=s.w; if(s.w>0) ever++; if(s.red) red++;
    const last = s.h.length ? s.h[s.h.length-1][1]===1 : s.streak>0; if(!s.red && last) known++; }
  const total = VERBS.length;
  return {total,studied,known,ever,red,ca,wa,percent: total?Math.round(known/total*100):0, today: P.daily[dayKey()]||{n:0,c:0,w:0}};
}

function persist(){ P.updatedAt = Date.now(); saveLocal(); if (SB && UID && CAN_SAVE) { dirty=true; clearTimeout(syncTimer); syncTimer=setTimeout(flush, 1200); } }
function logHistory(){}
async function flush(){
  if (!SB || !UID || writing || !dirty) return;
  writing = true; dirty = false;
  try {
    const { error } = await SB.from("progress").upsert({ user_id: UID, data: P, updated_at: new Date().toISOString() });
    if (error) throw error;
    setSync("synced");
  } catch(e) {

async function loadUserProgress(){
  let local = null;
  try { const raw = localStorage.getItem(lsKey()); if (raw) local = Object.assign(emptyProgress(), JSON.parse(raw)); } catch(e) {}
  P = local || emptyProgress();
  try {
    const { data, error } = await SB.from("progress").select("data").eq("user_id", UID).maybeSingle();
    if (error) throw error;
    if (data && data.data) {
      const remote = data.data;
      if ((remote.updatedAt||0) > (P.updatedAt||0)) {
        const merged = Object.assign(emptyProgress(), remote);
        merged.settings = Object.assign(emptyProgress().settings, remote.settings||{});
        P = merged;
      } else if ((P.updatedAt||0) > (remote.updatedAt||0)) { dirty = true; flush(); }
    } else if (P.updatedAt) { dirty = true; flush(); }
    setSync("synced");
  } catch(e) { setSync("error"); }
  if (P.settings.seenVersion == null && !P.updatedAt) P.settings.seenVersion = APP_VERSION; // new learner: nothing to announce
  saveLocal();
}

  SB = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  // Signing in by tapping the link in the email (also when it happens in another tab)
  SB.auth.onAuthStateChange((event, session) => { if (event === "SIGNED_IN" && session && !UID) setTimeout(() => afterSignIn(session), 0); });
  try {
    const { data } = await SB.auth.getSession();
    if (data && data.session) return afterSignIn(data.session);
  } catch(e) {}
  ACCESS = "signin"; render();
}
async function afterSignIn(session){
  if (UID) return;
  UID = session.user.id; EMAIL = session.user.email || "";
  await loadUserProgress(); ACCESS = "approved"; readHash(); render();
}
async function refreshStatus(){
  const [{ data: prof, error }, { data: admin }] = await Promise.all([
    SB.from("profiles").select("status").eq("id", UID).maybeSingle(),
    SB.rpc("is_admin"),
  ]);
  if (error) { ACCESS="error"; AUTH.error = error.message; return render(); }
  IS_OWNER = !!admin;
  const status = IS_OWNER ? "approved" : (prof && prof.status) || "pending";
  if (status === "approved") {
    if (ACCESS !== "owner" && ACCESS !== "approved") { await loadUserProgress(); ACCESS = IS_OWNER ? "owner" : "approved"; if (IS_OWNER) loadMembers(); readHash(); }
  } else {
    ACCESS = status === "declined" ? "declined" : "pending";
    clearTimeout(pollTimer); pollTimer = setTimeout(refreshStatus, 20000); // waiting for approval
  }
  render();
}
async function sendCode(email){
  AUTH.busy = true; AUTH.error = ""; AUTH.info = ""; render();
  const { error } = await SB.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
  AUTH.busy = false;
  if (error) { AUTH.error = error.message; }
  else { AUTH.email = email; AUTH.step = "code"; AUTH.resendAt = Date.now()+60000; AUTH.info = "We sent an email to " + email + ". Open it and tap the sign-in link — or type the code below if the email shows one. It can take a minute; check your spam folder too."; }
  render();

}
async function verifyCode(code){
  AUTH.busy = true; AUTH.error = ""; render();
  const { data, error } = await SB.auth.verifyOtp({ email: AUTH.email, token: code, type: "email" });
  AUTH.busy = false;
  if (error || !data.session) { AUTH.error = error ? error.message : "That code didn’t work. Try again."; return render(); }
  AUTH = {step:"email", email:"", error:"", info:"", busy:false, resendAt:0, mode:"password", pwStep:"signin"};
  ACCESS = "checking"; render();
  afterSignIn(data.session);
}
async function passwordAuth(email, password, isSignup){
  AUTH.busy = true; AUTH.error = ""; AUTH.info = ""; render();
  const res = isSignup ? await SB.auth.signUp({ email, password }) : await SB.auth.signInWithPassword({ email, password });
  AUTH.busy = false;
  const { data, error } = res;
  if (error) {
    const m = (error.message||"").toLowerCase();
    AUTH.error = m.includes("invalid login") ? "Wrong email or password. New here? Tap Create an account."
      : m.includes("already registered") ? "This email already has an account. Sign in instead."
      : m.includes("rate limit") ? "Too many attempts right now. Please wait a few minutes and try again."
      : error.message;
    return render();
  }
  if (data && data.session) { AUTH = {step:"email", email:"", error:"", info:"", busy:false, resendAt:0, mode:"password", pwStep:"signin"}; ACCESS="checking"; render(); return afterSignIn(data.session); }
  // Sign-up without a session: either email confirmation is on, or the email already exists.
  AUTH.pwStep = "signin";
  AUTH.info = "This email already has an account. Sign in with its password.";
  render();
}

/* ---------- Speech ---------- */
let svVoice = null, voiceStatus = "unknown";
function pickVoice(){
  if (!("speechSynthesis" in window)) { voiceStatus="none"; return; }
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  const sv = vs.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith("sv"));
  svVoice = sv.find(v=>/natural|neural|premium|enhanced|google/i.test(v.name)) || sv[0] || null;
  voiceStatus = svVoice ? "ok" : "missing";
  const el = document.getElementById("voicenote"); if (el) el.innerHTML = voiceText();
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.addEventListener?.("voiceschanged", pickVoice); }
function speak(text, btn){
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\//g, ", "));
  u.lang = "sv-SE"; if (svVoice) u.voice = svVoice; u.rate = 0.9;
  if (btn) { btn.classList.add("playing"); u.onend = u.onerror = () => btn.classList.remove("playing"); }
  speechSynthesis.speak(u);
}
function voiceText(){
  if (voiceStatus==="ok") return "🔊 Swedish voice: "+esc(svVoice.name)+". Tap any 🔊 to hear it.";
  if (voiceStatus==="none") return "🔊 This browser can’t play speech. Try Safari on iPhone or Chrome on Android.";
  if (voiceStatus==="missing") return "🔊 No Swedish voice found in this browser. On iPhone: Settings › Accessibility › Spoken Content › Voices › Swedish. On Android: Settings › Text-to-speech › install Swedish. Downloading the voice needs internet once; after that it works offline.";
  return "🔊 Audio uses your device’s Swedish voice. Some browsers stream voices online, so audio may need an internet connection.";
}

/* ---------- Real videos (YouGlish: Swedish speakers on YouTube) ---------- */
let YGW = null, YG_READY = null, VID = null;
function loadYouglish(){
  if (YG_READY) return YG_READY;
  YG_READY = new Promise((resolve, reject) => {
    window.onYouglishAPIReady = () => resolve();
    const tag = document.createElement("script");
    tag.src = "https://youglish.com/public/emb/widget.js";
    tag.async = true;
    tag.onerror = () => { YG_READY = null; reject(new Error("load")); };
    document.head.appendChild(tag);
    setTimeout(() => reject(new Error("timeout")), 15000);
  });
  return YG_READY;
}
function videoQueries(v){
  const out = [];
  for (const f of [v.pres, v.pret, v.inf, v.sup]) for (const part of String(f||"").split("/")) {
    const q = part.trim().toLowerCase();
    if (q && !out.includes(q)) out.push(q);
  }
  return out;
}
function renderVideoChrome(){
  const el = document.getElementById("vidhead"); if (!el || !VID) return;
  const v = BY_ID[VID.id];
  el.innerHTML = `<div class="vidtop"><div style="min-width:0"><b>🎬 ${esc(v.full)} in real videos</b>
      <div class="soft small">${VID.status==="loading"?"Finding Swedish speakers…":VID.status==="none"?"No videos found for this verb yet.":VID.status==="error"?"Videos couldn’t load. Check your internet connection and try again.":`Clip ${VID.track||1} of ${VID.total} for “${esc(VID.q)}”${VID.paused?" · tap ↺ Replay or Next →":""}`}</div></div>
      <button class="x" data-closevideo aria-label="Close videos">✕</button></div>
    <div class="chips vidforms">${VID.queries.map(q=>`<button class="chip pill${q===VID.q?" on":""}" data-vq="${esc(q)}" lang="sv">${esc(q)}</button>`).join("")}</div>
    ${VID.status==="ok"?`<div class="chips vidctl"><button class="btn btn-ghost" data-vctl="replay">↺ Replay</button><button class="btn btn-ghost" data-vctl="slow">${VID.slow?"🐢 Slow: on":"🐢 Slower"}</button><button class="btn btn-blue" data-vctl="next">Next →</button></div>`:""}`;
}
async function openVideo(id){
  const v = BY_ID[id]; if (!v) return;
  try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch(e) {}
  VID = { id, queries: videoQueries(v), qi: 0, q: "", status: "loading", total: 0, track: 0, slow: false };
  const m = document.getElementById("vidmodal"); m.hidden = false; document.body.style.overflow = "hidden";
  renderVideoChrome();
  try { await loadYouglish(); } catch(e) { VID.status = "error"; YG_READY = null; return renderVideoChrome(); }
  if (!YGW) {
    YGW = new YG.Widget("ygwidget", {
      components: 8 + 16 + 64, autoStart: 1, restrictionMode: 1, captionSize: 22,
      backgroundColor: "#FFFFFF", captionColor: "#1F5FAF", markerColor: "#F5C400", linkColor: "#1F5FAF",
      events: {
        onFetchDone: e => {
          if (!VID) return;
          if (e.totalResult > 0) { VID.status = "ok"; VID.total = e.totalResult; VID.track = 1; renderVideoChrome(); }
          else if (VID.auto && VID.qi + 1 < VID.queries.length) { VID.qi++; fetchVideo(VID.queries[VID.qi], true); }
          else { VID.status = "none"; renderVideoChrome(); }
        },
        // Short clips: rewind ~4 s before the sentence with the verb, stop ~4 s after it.
        onVideoChange: e => { if (VID) { VID.track = e.trackNumber || 1; resetClip(); renderVideoChrome(); } },
        onPlayerStateChange: e => { if (VID && VID.clip && e.state === 1 && !VID.clip.rewound) { VID.clip.rewound = true; try { YGW.move(-4); } catch(_) {} } },
        onCaptionChange: e => { if (VID && VID.clip && /\[\[\[|%5B%5B%5B/i.test(String(e.caption||""))) VID.clip.target = String(e.id); },
        onCaptionConsumed: e => {
          if (!VID || !VID.clip || !VID.clip.rewound || VID.clip.armed || VID.clip.target == null || String(e.id) !== VID.clip.target) return;
          VID.clip.armed = true; clearTimeout(VID.stopT);
          VID.stopT = setTimeout(() => { try { YGW.pause(); } catch(_) {} if (VID) { VID.paused = true; renderVideoChrome(); } }, VID.slow ? 5300 : 4000);
        },
        onError: () => { if (VID) { VID.status = "error"; renderVideoChrome(); } }
      }
    });
  }
  fetchVideo(VID.queries[0], true);
}
function resetClip(){ if (!VID) return; clearTimeout(VID.stopT); VID.clip = {rewound:false, target:null, armed:false}; VID.paused = false; }
function fetchVideo(q, auto){
  if (!VID || !YGW) return;
  resetClip();
  VID.q = q; VID.auto = auto; VID.qi = VID.queries.indexOf(q); VID.status = "loading"; VID.total = 0;
  renderVideoChrome();
  YGW.fetch(q, "swedish");
  if (VID.slow) setTimeout(() => { try { YGW.setSpeed(0.75); } catch(e) {} }, 1500);
}
function closeVideo(){
  const m = document.getElementById("vidmodal"); if (!m || m.hidden) return false;
  if (VID) clearTimeout(VID.stopT);
  try { YGW && YGW.pause(); } catch(e) {}
  m.hidden = true; document.body.style.overflow = ""; VID = null;
  return true;
}

  ${decl.length?`<div class="card" style="margin-top:14px"><b>Declined or removed (${decl.length})</b>${decl.map(m=>memberRow(m, `<button class="sbtn green" data-approve="${esc(m.id)}">Approve</button>`)).join("")}</div>`:""}
  <div class="card" style="margin-top:14px"><b>How to invite someone</b>
    <ol class="soft small steps"><li>Send them the link to this website.</li><li>They enter their email and type in the code they receive.</li><li>They appear above — tap <b>Approve</b> and the app opens for them.</li></ol>
  </div>`;
}

function homeView(){
  const s = stats(); const next = VERBS[P.learnPos||0];
  return `${whatsNewHtml()}<div class="hello">Hej! 👋</div><h1>Swedish Verb Trainer</h1>
  <p class="soft" style="margin:6px 0 0">${s.total} verbs from your PDF, with English and Persian meanings.</p>
  <div class="card" style="margin-top:20px">
    <div class="row" style="align-items:baseline;margin-bottom:10px"><span class="big">${s.percent}%</span><span class="soft">${s.known} of ${s.total} verbs known</span></div>
    ${bar(s.percent)}
    <div class="mini"><div><b>${s.studied}</b><span class="soft small">Studied</span></div><div><b>${s.today.n}</b><span class="soft small">Today</span></div><div><b>${s.red?'<span class="dot"></span>':""}${s.red}</b><span class="soft small">To review</span></div></div>
    <button class="btn btn-blue" style="margin-top:18px" data-start="learn">${P.learnPos>0?"Continue learning":"Start learning"}</button>
    ${next?`<p class="soft small" style="text-align:center;margin:10px 0 0">Next up: <span lang="sv">${esc(next.full)}</span></p>`:""}
  </div>
  <h2>Study modes</h2>
  <button class="mode" data-start="learn"><span class="em">📚</span><span><b>Learn all verbs</b><span>Every verb from the PDF, in order. Missed verbs are mixed in first.</span></span><span class="chev">›</span></button>
  <button class="mode" data-start="mistakes"${s.red?"":" disabled"}><span class="em">🔴</span><span><b>Practice my mistakes</b><span>${s.red?s.red+" verbs to review. They come back until you get them right twice in a row.":"No red-dot verbs yet."}</span></span><span class="chev">›</span></button>
  <button class="mode" data-start="random"><span class="em">🎲</span><span><b>Random practice</b><span>A random mix for daily revision. No verb repeats in a session.</span></span><span class="chev">›</span></button>
  <h2>Cards per session</h2>
  <div class="chips">${[10,20,50].map(n=>`<button class="chip${P.settings.size===n?" on":""}" data-size="${n}" aria-pressed="${P.settings.size===n}">${n}</button>`).join("")}</div>
  <div class="note"><div id="voicenote">${voiceText()}</div><div class="sync" id="syncnote">${syncText()}</div></div>`;
}

function listView(mistakesOnly){
  const redCount = VERBS.filter(v=>P.verbs[v.id]?.red).length;
  return `<h1>${mistakesOnly?"My Mistakes":"All Verbs"}</h1>
  <p class="soft small" style="margin:4px 0 0">${mistakesOnly ? (redCount?redCount+" verbs marked “not right” and not yet mastered.":"No mistakes yet. Verbs you mark “not right” will appear here.") : VERBS.length+" verbs · "+redCount+" with a red dot"}</p>
  <input class="search" id="q" type="search" placeholder="Search Swedish, English or فارسی" value="${esc(UI.query)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search verbs">
  ${mistakesOnly?"":`<div class="chips" style="margin-top:12px;justify-content:flex-start"><button class="chip pill${UI.onlyRed?"":" on"}" data-onlyred="0">All</button><button class="chip pill${UI.onlyRed?" on":""}" data-onlyred="1">🔴 Only incorrect</button></div>`}
  <div class="chips" style="margin-top:12px">${mistakesOnly
    ? `<button class="btn btn-red" data-start="mistakes"${redCount?"":" disabled"}>Practice my mistakes</button>`
    : `<button class="btn btn-ghost" data-start="learn">Review all</button><button class="btn btn-ghost" data-start="mistakes"${redCount?"":" disabled"}>Review red only</button>`}</div>
  <div class="list" id="list">${listItems(mistakesOnly)}</div>`;
}
function listItems(mistakesOnly){
  const redOnly = mistakesOnly || UI.onlyRed;
  const q = searchKey(UI.query.replace(/^att\s+/i,""));
  const items = VERBS.filter(v=>(!redOnly || P.verbs[v.id]?.red) && (!q || v.search.includes(q)));
  if (!items.length) return `<div class="empty">${q?"No verbs match your search.":"Nothing here yet."}</div>`;
  return items.map(v=>`<button class="item" data-open="${v.id}"><span style="min-width:0"><span class="name" lang="sv">${esc(v.full)}${P.verbs[v.id]?.red?'<span class="dot" aria-label="needs review"></span>':""}${v.flag?'<span style="font-size:.75rem" title="Corrected or flagged">⚠️</span>':""}</span><span class="m">${esc(v.en)}</span></span><span class="f fa" dir="rtl" lang="fa">${esc(v.fa)}</span></button>`).join("");
}

function detailView(id){
  const v = BY_ID[id]; const r = P.verbs[id];
  return `<button class="back" data-back>‹ Back</button>
  <div class="card">${verbHead(v)}<p class="soft small" style="margin:10px 0 0">Group ${esc(v.group)} · PDF row ${v.nr}</p>${formsHtml(v)}${explanationHtml(v)}</div>
  <div class="card" style="margin-top:16px"><b>Your history</b>
  ${!r?`<p class="soft">Not studied yet.</p>`:`
    <p class="row" style="margin:8px 0 0;font-weight:700;color:var(${r.red?"--red":"--green"})">${r.red?'<span class="dot"></span>Needs review ('+r.streak+"/"+MASTER_STREAK+" correct in a row to clear)":"Known"}</p>
    <p class="soft" style="margin:4px 0 0">✅ ${r.c} right · ❌ ${r.w} not right</p>
    <div class="hist">${r.h.slice(-40).map(e=>`<i style="background:var(${e[1]?"--green":"--red"})" title="${new Date(e[0]).toLocaleString()}"></i>`).join("")}</div>`}
  </div>
  <button class="btn btn-blue" style="margin-top:16px" data-practice="${v.id}">Practice this verb</button>`;
}

function progressView(){
  const s = stats();
  const days = []; for (let i=6;i>=0;i--){ const ts=Date.now()-i*864e5; const k=dayKey(ts); days.push(Object.assign({k,label:new Date(ts).toLocaleDateString("en-GB",{weekday:"short"})}, P.daily[k]||{n:0,c:0,w:0})); }
  const max = Math.max(5, ...days.map(d=>d.n));
  const tile = (val,label,color) => `<div class="tile"><b style="color:var(${color||"--ink"})">${val}</b><span class="soft small">${label}</span></div>`;
  return `<h1>Progress</h1>
  <div class="card" style="margin-top:14px"><div class="big">${s.percent}%</div><p class="soft" style="margin:4px 0 12px">of all verbs known</p>${bar(s.percent,12)}
    <button class="btn btn-blue" style="margin-top:18px" data-start="learn">Continue learning</button></div>
  <div class="grid">${tile(s.total,"Total verbs")}${tile(s.studied,"Verbs studied")}${tile(s.ca,"Answered right","--green")}${tile(s.wa,"Marked not right","--red")}${tile(s.red,"Still to review","--red")}${tile(s.ever,"Verbs ever missed")}</div>
  <div class="card" style="margin-top:14px"><b>Last 7 days</b><p class="soft small" style="margin:4px 0 0">Today: ${s.today.n} cards · ${s.today.c} right · ${s.today.w} not right</p>
    <div class="chart" role="img" aria-label="Cards answered per day for the last 7 days">${days.map(d=>`<div class="col"><div class="track"><div style="height:${d.w/max*100}%;background:var(--red)"></div><div style="height:${d.c/max*100}%;background:var(--green)"></div></div><small>${d.n||""}</small><small>${d.label}</small></div>`).join("")}</div></div>
  <div class="card" style="margin-top:14px"><b>Completed sessions</b>
    ${P.sessions.length?P.sessions.slice(0,15).map(x=>`<div class="sess"><b style="font-size:.95rem">${MODE_NAMES[x.mode]||x.mode}</b><div class="soft small">${new Date(x.ts).toLocaleDateString()} · ${x.c}/${x.n} right</div></div>`).join(""):`<p class="soft small">No sessions yet.</p>`}</div>
  <div class="card" style="margin-top:14px"><b>PDF import</b>
    <p class="soft small" style="margin:6px 0 0">${VERBS.length} verbs imported from ${VERBS.length+IMPORT_SKIPPED.length} PDF rows. ${IMPORT_SKIPPED.length} rows skipped (empty rows, a note and genuine duplicates). ${FLAGGED.length} entries corrected or flagged for checking.</p>
    <button class="linkbtn" data-report>${UI.showReport?"Hide details":"Show details"}</button>
    ${UI.showReport?`<div class="rep"><b class="small">Skipped rows</b>${IMPORT_SKIPPED.map(x=>`<p>Row ${x.nr}: ${esc(x.reason)}</p>`).join("")}
      <b class="small" style="display:block;margin-top:12px">Corrected or flagged ⚠️</b>${FLAGGED.map(v=>`<p><button class="linkbtn" style="padding:0" data-open="${v.id}">${esc(v.full)}</button> (row ${v.nr}): ${esc(v.flag)}</p>`).join("")}</div>`:""}
    <div class="sync" id="syncnote">${syncText()}</div></div>
  <div class="card" style="margin-top:14px"><b>Password</b>
    <p class="soft small" style="margin:6px 0 0">Change the password you use to sign in.</p>
    <form id="setpwform" class="authform" style="margin:12px 0 0;max-width:none" novalidate>
      <input type="email" autocomplete="username" value="${esc(EMAIL)}" hidden>
      <label for="newpw" class="soft small">New password</label>
      <input id="newpw" class="search" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
      <label for="newpw2" class="soft small">Repeat new password</label>
      <input id="newpw2" class="search" type="password" autocomplete="new-password" minlength="6" placeholder="Same password again" required>
      <button class="btn btn-blue" type="submit">Save password</button>
    </form>
    ${PWMSG?`<p class="${PWMSG.err?"autherr":"authinfo"}" style="margin:12px 0 0;max-width:none">${esc(PWMSG.text)}</p>`:""}
  </div>
  <button class="btn btn-ghost" style="margin-top:20px" data-reset>Reset progress</button>
  <p class="soft small" style="text-align:center;margin-top:16px">Signed in as ${esc(EMAIL)} · Version ${APP_LABEL}</p>
  <button class="btn btn-ghost" style="margin-top:8px" data-signout>Sign out</button>`;
}

function studyView(){
  const S = UI.study;
  if (S.i >= S.queue.length) {
    const pct = S.n ? Math.round(S.c/S.n*100) : 0;
    return `<div class="done"><div class="e">${S.n===0?"🎉":pct>=80?"🌟":"💪"}</div><h1>${S.n===0?"Nothing to review":"Session complete"}</h1>
      ${S.n?`<p class="soft">${S.c} right, ${S.w} not right (${pct}%)</p>`:""}
      <button class="btn btn-blue" style="margin-top:28px" data-end>Back to home</button></div>`;
  }
  const item = S.queue[S.i]; const v = BY_ID[item.id]; const r = P.verbs[item.id];
  return `<div class="studytop"><button class="x" data-end aria-label="End session">✕</button>
    <div style="flex:1"><div class="soft small" style="font-weight:600;margin-bottom:6px">${MODE_NAMES[S.mode]} · ${S.i+1} of ${S.queue.length}</div>${bar(S.i/S.queue.length*100,6)}</div></div>
  <div class="card${S.answer===null&&S.fresh?" enter":""}">
    ${(S.answer===null ? r?.red : S.prevRed)?`<span class="tag"><span class="dot" style="width:8px;height:8px"></span>Review again</span>`:""}
    ${verbHead(v)}${formsHtml(v)}
    ${S.answer===null?`<p class="hint">Do you remember what this verb means?</p>`:
      `<div class="reveal"><div class="verdict" style="background:var(${S.answer?"--green-soft":"--red-soft"});color:var(${S.answer?"--green":"--red"})">${S.answer?"✅ Marked as right":"🔴 Added to My Mistakes"}</div>${explanationHtml(v)}</div>`}
  </div>
  <div class="actions"><div class="in">${S.answer===null
    ? `<button class="btn btn-red" data-answer="0">❌ I’m Not Right</button><button class="btn btn-green" data-answer="1">✅ I’m Right</button>`
    : `<button class="btn btn-blue" data-next>${S.i+1>=S.queue.length?"Finish session":"Next Verb →"}</button>`}</div></div>`;
}

function render(){
  const app = document.getElementById("app");
  if (ACCESS!=="owner" && ACCESS!=="approved") { app.innerHTML = `<main class="wrap">${gateView()}</main>`; document.getElementById("tabs").innerHTML = ""; return; }
  let html;
  if (UI.study) html = studyView();
  else if (UI.detail) html = detailView(UI.detail);
  else if (UI.tab==="verbs") html = listView(false);
  else if (UI.tab==="mistakes") html = listView(true);
  else if (UI.tab==="progress") html = progressView();
  else if (UI.tab==="members" && IS_OWNER) html = membersView();
  else html = homeView();
  app.innerHTML = `<main class="wrap">${html}</main>`;
  const s = stats();
  document.getElementById("tabs").innerHTML = (UI.study || UI.detail) ? "" :
    `<div class="tabs"><nav role="tablist">${tabsFor().map(([k,ic,l])=>`<button class="tab${UI.tab===k?" on":""}" role="tab" aria-selected="${UI.tab===k}" data-tab="${k}"><span class="ic">${ic}</span><span data-badge="${k}">${tabLabel(k,l,s)}</span></button>`).join("")}</nav></div>`;
  if (UI.study) UI.study.fresh = false;
}

/* ---------- Actions ---------- */
function start(mode){ const s = buildSession(mode); UI.detail=null; UI.study = Object.assign(s,{i:0,answer:null,n:0,c:0,w:0,fresh:true}); render(); window.scrollTo(0,0); }
function answer(ok){
  const S = UI.study; if (!S || S.answer!==null) return;
  const item = S.queue[S.i];
  S.prevRed = !!P.verbs[item.id]?.red;
  const rec = applyAnswer(item.id, ok, item.learnIdx!=null ? INDEX[item.id] : null);
  S.answer = ok; S.n++; ok ? S.c++ : S.w++;
  if (S.mode==="mistakes" && rec.red) S.queue.splice(Math.min(S.queue.length, S.i+4), 0, {id:item.id});
  render();
}
function next(){ const S=UI.study; S.i++; S.answer=null; S.fresh=true; render(); window.scrollTo(0,0); }
function endStudy(){ const S=UI.study; addSession({mode:S.mode,n:S.n,c:S.c,w:S.w}); UI.study=null; UI.tab="home"; render(); window.scrollTo(0,0); }

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.speak !== undefined) return speak(d.speak, t);
  if (d.video) return openVideo(d.video);
  if (d.closevideo !== undefined) return closeVideo();
  if (d.vq) return fetchVideo(d.vq, false);
  if (d.vctl && YGW) { if (d.vctl==="next") { resetClip(); YGW.next(); } else if (d.vctl==="replay") { resetClip(); YGW.replay(); renderVideoChrome(); } else { VID.slow = !VID.slow; try { YGW.setSpeed(VID.slow ? 0.75 : 1); } catch(e) {} renderVideoChrome(); } return; }
  if (d.signout !== undefined) return signOut();
  if (d.checknow !== undefined) { t.disabled = true; return refreshStatus(); }
  if (d.resend !== undefined) return sendCode(AUTH.email);
  if (d.authmode) { AUTH.mode = d.authmode; AUTH.step = "email"; AUTH.error = ""; AUTH.info = ""; if (!AUTH.pwStep) AUTH.pwStep = "signin"; return render(); }
  if (d.pwstep) { AUTH.pwStep = d.pwstep; AUTH.error = ""; AUTH.info = ""; return render(); }
  if (d.changeemail !== undefined) { AUTH.step="email"; AUTH.error=""; AUTH.info=""; return render(); }
  if (d.refreshmembers !== undefined) return loadMembers();
  if (d.approve) return memberAction("approve", d.approve, t);
  if (d.decline) return memberAction("decline", d.decline, t);
  if (d.remove) return memberAction("remove", d.remove, t);
  if (d.reload !== undefined) { flush(); return setTimeout(()=>location.reload(), 300); }
  if (d.seen !== undefined) { P.settings.seenVersion = APP_VERSION; persist(); return render(); }
  if (d.tab) return go(d.tab);
  if (d.start) return start(d.start);
  if (d.size) { P.settings.size = +d.size; persist(); return render(); }
  if (d.answer) return answer(d.answer==="1");
  if (d.next !== undefined) return next();
  if (d.end !== undefined) return endStudy();
  if (d.open) { UI.detail = d.open; render(); return window.scrollTo(0,0); }
  if (d.back !== undefined) { UI.detail = null; return render(); }
  if (d.practice) { UI.detail=null; UI.study={mode:"single",queue:[{id:d.practice}],i:0,answer:null,n:0,c:0,w:0,fresh:true}; render(); return window.scrollTo(0,0); }
  if (d.onlyred) { UI.onlyRed = d.onlyred==="1"; return render(); }
  if (d.report !== undefined) { UI.showReport = !UI.showReport; return render(); }
  if (d.reset !== undefined) { if (confirm("Reset all progress? This deletes your answers, red dots and history. The verb list stays.")) { P = emptyProgress(); persist(); render(); } }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "emailform") {
    const v = (document.getElementById("email").value||"").trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { AUTH.error = "Please enter a valid email address."; AUTH.email = v; return render(); }
    return sendCode(v);
  }
  if (e.target.id === "pwform") {
    const em = (document.getElementById("pwemail").value||"").trim().toLowerCase();
    const pw = document.getElementById("pw").value||"";
    AUTH.email = em;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { AUTH.error = "Please enter a valid email address."; return render(); }
    if (pw.length < 6) { AUTH.error = "The password needs at least 6 characters."; return render(); }
    return passwordAuth(em, pw, AUTH.pwStep === "signup");
  }
  if (e.target.id === "setpwform") {
    const a = document.getElementById("newpw").value||"", b = document.getElementById("newpw2").value||"";
    if (a.length < 6) { PWMSG = {err:true, text:"The password needs at least 6 characters."}; return render(); }
    if (a !== b) { PWMSG = {err:true, text:"The two passwords are not the same."}; return render(); }
    return setPassword(a);
  }
  if (e.target.id === "codeform") {
    const v = (document.getElementById("code").value||"").replace(/\D/g,"");
    if (v.length < 6) { AUTH.error = "The code has at least 6 digits."; return render(); }
    return verifyCode(v);
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { UI.query = e.target.value; document.getElementById("list").innerHTML = listItems(UI.tab==="mistakes"); }
});
document.addEventListener("keydown", e => {
  if (VID) { if (e.key === "Escape") closeVideo(); return; }
  if (!UI.study || e.target.tagName === "INPUT") return;
  if (UI.study.answer===null && UI.study.i < UI.study.queue.length) {
    if (e.key==="ArrowRight") answer(true); else if (e.key==="ArrowLeft") answer(false);
  } else if (e.key==="Enter" || e.key===" ") { e.preventDefault(); UI.study.i < UI.study.queue.length ? next() : endStudy(); }
  if (e.key==="Escape") endStudy();
});
window.addEventListener("hashchange", () => { readHash(); if (!UI.study) { UI.detail=null; render(); } });

readHash();
render();
initAccess();
</script>
</body>
</html>
